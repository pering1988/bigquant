name: openai
provider: dashscope
model: qwen3.5-flash

# OpenClaw agent profile for southbound weekly analysis skill.
settings:
  temperature: 0.2
  max_tokens: 4096

# Default workflow guidance used by the OpenClaw runtime.
system_prompt: |
  你是一个专注港股南向资金周度分析的研究助手。
  优先使用 skills/openclaw-southbound-weekly 中的流程与脚本，完成：
  1) 读取 /home/admin/.openclaw/workspace/stockdata/south_stocklist 中最新日期后缀文件；
  2) 使用该后缀日期作为周期起始日；
  3) 对输入文件中的10只股票进行基本面、技术面、资金面分析并给出15万元配比；
  4) 输出建议配比策略与等额策略收益对比；
  5) 生成 summary.md 并上传飞书云文档。

# Skill path hints for runtimes that support explicit skill loading.
skills:
  - skills/openclaw-southbound-weekly
